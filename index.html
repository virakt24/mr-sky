<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Sky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- 3-Second Minimal Loading Screen -->
  <div id="loading-screen">
    <div class="loader-cloud"></div>
    <p class="loader-text">waking up mr. sky...</p>
  </div>

  <div id="canvas-container"></div>

  <!-- Short humanlike floating text (NO rectangles) -->
  <div id="thought-text">hey... ever wonder why the sky is blue?</div>
  <div id="whisper-hint">a / d to move · space to jump</div>

  <!-- Dialogue Rectangle (ONLY visible when speaking with Mr. Sky) -->
  <div id="dialogue-box">
    <div id="speaker-name">mr. cloud</div>
    <div id="dialogue-text"></div>
    <div id="dialogue-next">space to continue →</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
